[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reader-workbench-companion"
version = "0.1.0"
description = "Convert public articles and local Substack exports to EPUB and send them to a reader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.4,<13"]

[project.scripts]
reader-send = "reader_send.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
